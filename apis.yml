name: Envariant
description: >-
  Envariant is building the control layer for foundation models — an AI
  interpretability SDK that lets teams inspect, steer, and control model
  behavior. The SDK exposes a compact set of primitives: detect and causally
  trace behaviors like hallucinations or invariant violations, reason
  inductively and steer outputs programmatically, extract human-readable domain
  principles, and synthesize targeted edge cases — moving verification upstream,
  directly into the model's latent space, with no bespoke engineering required.
  Envariant is a Y Combinator (Winter 2026) company based in San Francisco. The
  SDK is in pre-release beta, so no public API, OpenAPI, or developer
  documentation is available yet; this profile captures the company identity
  ahead of a public developer surface.
